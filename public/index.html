<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050506">
    <meta name="description" content="OpenFurX — avatar showcase with live 3D preview, PhysBones, clothing toggles and expression menus.">
    <title>OpenFurX</title>
    <link rel="icon" href="img/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="modulepreload" href="js/app.js">
    <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <div class="bg-fx" aria-hidden="true">
        <div class="bg-fx__grid"></div>
        <span class="beam beam--h" style="--y:18%;--d:7s;--delay:-1s"></span>
        <span class="beam beam--h" style="--y:46%;--d:11s;--delay:-6s"></span>
        <span class="beam beam--h beam--rev" style="--y:73%;--d:9s;--delay:-3s"></span>
        <span class="beam beam--v" style="--x:12%;--d:8s;--delay:-2s"></span>
        <span class="beam beam--v beam--rev" style="--x:64%;--d:12s;--delay:-7s"></span>
        <span class="beam beam--v" style="--x:88%;--d:10s;--delay:-4s"></span>
        <div class="bg-fx__vignette"></div>
        <div class="bg-fx__scan"></div>
    </div>

    <header class="topbar">
        <a class="brand" href="#/" aria-label="OpenFurX home">
            <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 29 9.5v13L16 30 3 22.5v-13z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 11l6 10 6-10M16 21v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg>
            <span class="brand__text glitch" data-text="OPENFURX">OPENFURX</span>
        </a>
        <nav class="topnav" aria-label="Main">
            <a class="topnav__link" href="#/" data-nav="gallery">Gallery</a>
            <a class="topnav__link" href="#/owner" data-nav="owner"><span class="status-dot" id="owner-dot"></span><span id="owner-label">Owner</span></a>
        </nav>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <noscript><p class="noscript">OpenFurX needs JavaScript and WebGL to show avatars.</p></noscript>
</body>
</html>
